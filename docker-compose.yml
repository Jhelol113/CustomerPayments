version: '3.8'

services:
  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: customer_payment_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: customer_payment_db
    ports:
      - "3307:3306" # Expuesto en el puerto 3307 para no chocar con tu MySQL local
    volumes:
      - db_data:/var/lib/mysql
      # Autoejecuta los scripts SQL al iniciar el contenedor por primera vez
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 10s
      retries: 10

  # Backend .NET API
  api:
    build: 
      context: ./CustomerPaymentAPI
      dockerfile: Dockerfile
    container_name: customer_payment_api
    ports:
      - "5263:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=customer_payment_db;User=root;Password=rootpassword123;
    depends_on:
      db:
        condition: service_healthy

  # Frontend React (Vite)
  frontend:
    build:
      context: ./CustomerPaymentVisual
      dockerfile: Dockerfile
    container_name: customer_payment_frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
